name: semaphore

base: core20

version: 2.18.12

license: MIT

summary: Modern UI and powerful API for Ansible, Terraform and other DevOps tools

architectures:
- build-on: amd64
- build-on: arm64

description: |
  Semaphore is beautiful web interface for running Ansible playbooks.
  If your project has grown and deploying from the terminal is no longer for you then Semaphore is what you need.

grade: stable

confinement: classic

# The daemon starts as root (required for snapctl set) and setup-env drops
# privileges to this user via setpriv before exec-ing Semaphore.
system-usernames:
  snap_daemon: shared

apps:
  server:
    command: bin/semaphore server --no-config
    command-chain:
      - bin/setup-env
    environment:
      SNAPCRAFT_PRELOAD_REDIRECT_ONLY_SHM: 1
    daemon: simple

  runner:
    command: bin/semaphore runner start --auto-register --no-config
    command-chain:
      - bin/setup-env
    environment:
      SNAPCRAFT_PRELOAD_REDIRECT_ONLY_SHM: 1
    daemon: simple
    # The runner is optional and needs runner.server-url and
    # runner.registration-token to be configured first:
    #   snap set semaphore runner.server-url=... runner.registration-token=...
    #   snap start --enable semaphore.runner
    install-mode: disable

  cli:
    command: bin/semaphore --no-config
    command-chain:
      - bin/setup-env
    environment:
      SNAPCRAFT_PRELOAD_REDIRECT_ONLY_SHM: 1


parts:
  semaphore:
    plugin: dump
    source:
      - on amd64: https://github.com/semaphoreui/semaphore/releases/download/v2.18.12/semaphore_2.18.12_linux_amd64.tar.gz
      - on arm64: https://github.com/semaphoreui/semaphore/releases/download/v2.18.12/semaphore_2.18.12_linux_arm64.tar.gz
    source-type: tar
    organize:
      semaphore: bin/semaphore

  scripts:
    plugin: dump
    source: scripts
    organize:
      setup-env: bin/setup-env
    # setpriv is used by setup-env to drop root privileges to snap_daemon.
    stage-packages:
      - util-linux